[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osc-surface-nicegui-ui"
version = "0.1.0"
description = "NiceGUI control surface for OSC Surface (Open Stage Control as a headless OSC/WebSocket bridge)"
requires-python = ">=3.11"
dependencies = [
    "nicegui>=2.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
osc-surface-ui = "osc_surface_ui.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/osc_surface_ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
