[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oscdesk-nicegui-ui"
version = "0.1.0"
description = "NiceGUI control surface for OSCDesk (headless OSC/WebSocket bridge)"
requires-python = ">=3.11"
dependencies = [
    "nicegui>=2.0",
    # surface_link は connect(..., proxy=None) を渡す(D-023)。proxy 引数は
    # websockets 14.0 で追加されたため、それ未満では接続が TypeError で全滅する
    "websockets>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
oscdesk-ui = "oscdesk_ui.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oscdesk_ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
